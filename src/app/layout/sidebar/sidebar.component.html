<aside class="fixed inset-y-0 left-0 w-64 bg-[#0D8ABC] shadow-lg" *ngIf="isOpen">
    <div class="flex flex-col h-full">
        <!-- Logo -->
        <div class="flex items-center justify-center h-16 px-4 border-b border-blue-400">
            <h1 class="text-xl font-semibold text-white">Leave Management</h1>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 py-4 space-y-4 overflow-y-auto">
            <!-- Leave Management Group -->
            <div class="space-y-1">
                <a routerLink="/pages/dashboard" routerLinkActive="bg-blue-500 text-white"
                    class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    Dashboard
                </a>
                <a routerLink="/pages/my-leave-workflows" routerLinkActive="bg-blue-500 text-white"
                    class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg>
                    My Leaves
                </a>

                <button type="button" *ngIf="hasAdminOrManagerRole()"
                    class="flex items-center w-full px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg transition-colors duration-200"
                    (click)="toggleDropdown('leave')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    Leave Management
                    <svg class="w-4 h-4 ml-auto transition-transform duration-200" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" [class.rotate-180]="isDropdownOpen('leave')">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div class="pl-4 space-y-1 dropdown-content" [class.show]="isDropdownOpen('leave')">
                    <a routerLink="/pages/leave-requests" routerLinkActive="bg-blue-500 text-white"
                        class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                            </path>
                        </svg>
                        Leave Requests <span
                            class="text-xs ml-2 border border-red-300 bg-red-100 font-semibold text-red-700 rounded-full px-2 py-1">
                            {{pendingRequestsCount}}
                        </span>

                    </a>
                    <a routerLink="/pages/current-leaves" routerLinkActive="bg-blue-500 text-white"
                        class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Current Leaves
                    </a>

                </div>
            </div>

            <!-- Reports Group -->
            <div class="space-y-1" *ngIf="hasAdminOrManagerRole()">
                <button type="button"
                    class="flex items-center w-full px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg transition-colors duration-200"
                    (click)="toggleDropdown('reports')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    Reports
                    <svg class="w-4 h-4 ml-auto transition-transform duration-200" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" [class.rotate-180]="isDropdownOpen('reports')">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div class="pl-4 space-y-1 dropdown-content" [class.show]="isDropdownOpen('reports')">
                    <a routerLink="/pages/reports" routerLinkActive="bg-blue-500 text-white"
                        class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        Leave Reports
                    </a>
                    <a routerLink="/pages/team-calendar" routerLinkActive="bg-blue-500 text-white"
                        class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        Team Calendar
                    </a>
                </div>
            </div>

            <!-- Administration Group -->
            <div class="space-y-1" *ngIf="hasAdminOrManagerRole()">
                <button type="button"
                    class="flex items-center w-full px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg transition-colors duration-200"
                    (click)="toggleDropdown('admin')">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                        </path>
                    </svg>
                    Administration
                    <svg class="w-4 h-4 ml-auto transition-transform duration-200" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" [class.rotate-180]="isDropdownOpen('admin')">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div class="pl-4 space-y-1 dropdown-content" [class.show]="isDropdownOpen('admin')">
                    <a routerLink="/pages/leaves" routerLinkActive="bg-blue-500 text-white"
                        class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        Leaves
                    </a>
                    <a routerLink="/pages/users" routerLinkActive="bg-blue-500 text-white"
                        class="flex items-center px-4 py-2 text-sm text-white hover:bg-blue-500 hover:text-white rounded-lg nav-link">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                            </path>
                        </svg>
                        Users
                    </a>
                </div>
            </div>
        </nav>
    </div>
</aside>
