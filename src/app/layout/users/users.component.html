<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">User Management</h1>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center items-center h-64">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-emerald-500"></div>
    </div>

    <!-- Content -->
    <div *ngIf="!isLoading" class="bg-white rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">User
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr *ngFor="let user of users">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <img class="h-10 w-10 rounded-full" [src]="user.profilePicture" [alt]="user.firstName">
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-gray-900">{{ user.firstName }} {{ user.lastName
                                        }}</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm text-gray-900">{{ user.email }}</div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span *ngFor="let role of user.roles"
                                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" [ngClass]="{
                                    'bg-blue-100 text-blue-800': role === 'ROLE_ADMIN',
                                    'bg-green-100 text-green-800': role === 'ROLE_MANAGER',
                                    'bg-gray-100 text-gray-800': role === 'ROLE_STAFF'
                                }">
                                {{ role.replace('ROLE_', '') }}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                            <button *ngIf="isAdmin()" (click)="openRoleModal(user)"
                                class="text-emerald-600 hover:text-emerald-900 mr-3">Edit Role</button>
                            <!-- <button (click)="deleteUser(user.id)"
                                class="text-red-600 hover:text-red-900">Delete</button> -->
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Role Modal -->
    <div *ngIf="isModalOpen" class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity duration-300 ease-in-out"
        [class.opacity-0]="!isModalOpen" [class.opacity-100]="isModalOpen">
    </div>

    <div *ngIf="isModalOpen" class="fixed inset-0 flex items-center justify-center z-50"
        [class.opacity-0]="!isModalOpen" [class.opacity-100]="isModalOpen">
        <div class="bg-white rounded-lg p-8 max-w-md w-full mx-4 transform transition-all duration-300 ease-in-out"
            [class.scale-95]="!isModalOpen" [class.scale-100]="isModalOpen">
            <h2 class="text-xl font-bold mb-4">Update User Role</h2>
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="role">Role</label>
                <select id="role" [(ngModel)]="selectedUser.role"
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="" disabled selected>Select Role</option>
                    <option *ngFor="let role of roles" [value]="role">
                        {{ role.replace('ROLE_', '') }}
                    </option>
                </select>
            </div>
            <div class="flex justify-end">
                <button (click)="closeModal()"
                    class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg mr-2">Cancel</button>
                <button (click)="updateUserRole()" [disabled]="isSubmitting"
                    class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg flex items-center">
                    <span *ngIf="isSubmitting" class="mr-2">
                        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                    {{ isSubmitting ? 'Saving...' : 'Save' }}
                </button>
            </div>
        </div>
    </div>
</div>
